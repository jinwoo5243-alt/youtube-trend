<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간 인기 키워드</title>
<style>
:root{
  --bg:#0f1115;--card:#181b20;--card2:#1e222a;--fg:#eceef0;--sub:#9aa0a6;
  --line:#262a30;--accent:#ef4444;--accent2:#dc2626;--green:#34d399;
  --up:#f04545;--down:#5b8def;--chip:#20242c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 60px}

/* 상단 뒤로가기 */
.top{display:flex;justify-content:flex-start;margin-bottom:8px}
.back{font-size:13px;color:var(--sub);text-decoration:none;padding:6px 12px;
  border:1px solid var(--line);border-radius:20px;background:var(--card)}
.back:hover{color:var(--fg);border-color:#3a3f47}

/* 헤더 */
.hero{text-align:center;padding:14px 0 26px}
.hero .ico{width:54px;height:54px;border-radius:14px;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 8px 24px rgba(239,68,68,.35)}
.hero h1{font-size:34px;margin:0 0 10px;letter-spacing:-.5px}
.hero p{color:var(--sub);font-size:14px;margin:0;line-height:1.6}

/* 모드 토글 */
.modes{display:flex;justify-content:center;gap:10px;margin:22px 0 26px}
.modes button{font:inherit;font-size:14px;font-weight:600;padding:10px 22px;border-radius:24px;
  border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;transition:.15s}
.modes button.on{background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 6px 16px rgba(239,68,68,.3)}

/* 패널 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.phead{padding:18px 20px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.phead .ttl{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
.badge-red{font-size:11px;font-weight:700;color:#fff;background:var(--accent2);
  padding:3px 9px;border-radius:7px}
.phead .desc{flex-basis:100%;color:var(--sub);font-size:12.5px;margin-top:-2px}
.ctrls{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:12.5px;padding:7px 14px;background:transparent;color:var(--sub);
  border:0;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.ghost{font:inherit;font-size:12.5px;padding:7px 14px;border:1px solid var(--line);
  background:var(--card2);color:var(--fg);border-radius:10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.ghost:hover{border-color:#3a3f47}

/* 테이블 */
.thead,.row{display:grid;grid-template-columns:64px 1fr 150px 210px 190px;align-items:center}
.thead{padding:12px 20px;border-bottom:1px solid var(--line);color:var(--sub);
  font-size:12px;font-weight:600}
.thead .r{text-align:right}
.rows{}
.row{padding:16px 20px;border-bottom:1px solid var(--line);transition:.12s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--card2)}
.rank{width:34px;height:34px;border-radius:9px;background:var(--chip);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent);font-size:14px}
.kw{display:flex;align-items:center;gap:7px;min-width:0}
.kw .name{font-size:16px;font-weight:700}
.kw .ext{color:var(--sub);font-size:12px;text-decoration:none}
.kw .ext:hover{color:var(--accent)}
.star{margin-left:4px;cursor:pointer;color:#4b515a;font-size:15px;line-height:1}
.star.on{color:#fbbf24}
.cons{text-align:right;font-size:17px;font-weight:800;color:var(--green)}
.cons small{display:block;font-size:11px;font-weight:600;color:var(--sub)}

/* 스파크라인 셀 */
.spark{position:relative;width:188px}
.spark svg{display:block;width:188px;height:52px}
.spk-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub);margin-top:3px}
.spk-lbl b{display:block;color:var(--fg);font-size:11px;font-weight:700}
.chg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;white-space:nowrap}
.chg.up{background:rgba(240,69,69,.16);color:#f87171}
.chg.down{background:rgba(91,141,237,.16);color:#7aa2f5}

/* 상태 */
.status{text-align:right}
.ok{display:inline-block;font-size:11px;font-weight:700;color:var(--green);
  background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.25);
  padding:3px 10px;border-radius:7px}
.upd{display:block;font-size:11px;color:var(--sub);margin-top:4px}

.empty{padding:56px 20px;text-align:center;color:var(--sub)}
.empty .big{font-size:40px;margin-bottom:10px}
.src{text-align:center;color:#555b63;font-size:11.5px;margin-top:14px}

@media(max-width:720px){
  .hero h1{font-size:26px}
  .thead{display:none}
  .row{grid-template-columns:44px 1fr;grid-row-gap:10px;padding:14px 14px}
  .cons{grid-column:2;text-align:left}
  .spark{grid-column:1 / -1;width:100%}
  .spark svg{width:100%}
  .status{grid-column:1 / -1;text-align:left}
}
</style></head><body>
<div class="wrap">
  <div class="top"><a class="back" href="index.html">← 트렌딩 수집으로</a></div>

  <div class="hero">
    <div class="ico">📈</div>
    <h1>주간 인기 키워드</h1>
    <p>YouTube Shorts 조회수순 수집 결과로 요즘 뜨는 키워드와 일별 소비량 흐름을 확인하세요.</p>
  </div>

  <div class="modes">
    <button id="mTop" class="on" onclick="setMode('top')">🔥 주간 Top 100</button>
    <button id="mMine" onclick="setMode('mine')">🔖 내 키워드</button>
  </div>

  <div class="panel">
    <div class="phead">
      <div class="ttl"><span id="panelTitle">주간 인기 키워드 TOP 100</span>
        <span class="badge-red" id="basisBadge">7일 조회수 기준</span></div>
      <div class="ctrls">
        <div class="seg">
          <button id="p24" onclick="setPeriod('24h')">24시간</button>
          <button id="p7" class="on" onclick="setPeriod('7d')">7일</button>
        </div>
        <button class="ghost" id="sortBtn" onclick="toggleSort()">⇅ <span>소비량순</span></button>
      </div>
      <div class="desc">키워드를 클릭하면 24시간 및 7일 수집 영상 목록과 세부 분석을 확인할 수 있습니다.</div>
    </div>

    <div class="thead">
      <div>순위</div><div>키워드</div><div class="r" id="consHead">7일 소비량 ↓</div>
      <div>일별 흐름 (최근 최대 14일치)</div><div class="r">수집 상태 · 한국시간</div>
    </div>
    <div class="rows" id="rows"></div>
  </div>
  <div class="src" id="src"></div>
</div>

<script>
/* ---------- 상태 ---------- */
let MODE='top', PERIOD='7d', SORT='cons';
const FAVKEY='kw_favs';
let favs = loadFavs();
let DATA = [];

/* ---------- 유틸 ---------- */
function loadFavs(){ try{return JSON.parse(localStorage.getItem(FAVKEY)||'[]')}catch(e){return[]} }
function saveFavs(){ try{localStorage.setItem(FAVKEY,JSON.stringify(favs))}catch(e){} }
function fmt(man){ // 단위: 만회
  const v=man*10000;
  if(v>=1e8) return (v/1e8).toFixed(1).replace(/\.0$/,'')+'억회';
  if(v>=1e4) return Math.round(v/1e4).toLocaleString()+'만회';
  return v.toLocaleString()+'회';
}
function gen(start,end){ // 14일 추이 생성(데모용)
  const n=14,a=[];
  for(let i=0;i<n;i++){
    const t=i/(n-1), base=start+(end-start)*t;
    const noise=Math.sin(i*1.7+start*0.01)*base*0.045;
    a.push(Math.max(1,Math.round(base+noise)));
  }
  a[0]=start; a[n-1]=end; return a;
}

/* ---------- 데모 데이터 [키워드, 시작값, 종료값(만회), 시작일, 종료일, 업데이트] ---------- */
const DEMO=[
  ['이유',16500,13000,'10/15','10/28','01:30'],
  ['A2O',5504,11680,'10/17','10/28','00:16'],
  ['고양이',6234,11180,'10/15','10/28','01:34'],
  ['웃긴',6469,10900,'10/15','10/28','01:33'],
  ['엄마',7401,10516,'10/15','10/28','00:01'],
  ['가족',5474,9806,'10/15','10/28','00:00'],
  ['챌린지',4210,9120,'10/16','10/28','01:10'],
  ['레시피',5900,8740,'10/15','10/28','00:42'],
  ['브이로그',6100,8300,'10/15','10/28','01:05'],
  ['먹방',7200,8010,'10/16','10/28','00:20'],
  ['강아지',4800,7650,'10/15','10/28','01:22'],
  ['운동',5100,7210,'10/17','10/28','00:55'],
  ['여행',6300,6980,'10/15','10/28','01:40'],
  ['리뷰',5600,6420,'10/16','10/28','00:12'],
  ['게임',7000,6150,'10/15','10/28','01:03'],
  ['수능',2100,5880,'10/19','10/28','00:38'],
];

function buildData(raw){
  // raw: 배열의 배열(데모) 또는 [{term,trend:[...],update}] (JSON)
  return raw.map(r=>{
    let term,trend,upd;
    if(Array.isArray(r)){ term=r[0]; trend=gen(r[1],r[2]); upd='10.28 '+r[5]; r._s=r[3]; r._e=r[4]; }
    else { term=r.term; trend=(r.trend&&r.trend.length?r.trend:gen(1000,1000)); upd=r.lastUpdate||''; }
    const start=trend[0], end=trend[trend.length-1], prev=trend.length>1?trend[trend.length-2]:start;
    return {
      term, trend, upd,
      startLabel:(Array.isArray(r)?r[3]:(r.startDate||'')),
      endLabel:(Array.isArray(r)?r[4]:(r.endDate||'')),
      cons7d:end,
      cons24h:Math.max(0,end-prev),
      chg:((end-start)/start*100)
    };
  });
}

/* ---------- 스파크라인 ---------- */
function sparkSVG(trend){
  if(trend.length<2) trend=[trend[0],trend[0]]; // 하루치면 평평한 선으로
  const w=188,h=52,pad=4, min=Math.min(...trend),max=Math.max(...trend),rng=(max-min)||1;
  const up=trend[trend.length-1]>=trend[0];
  const col=up?getCss('--up'):getCss('--down');
  const pts=trend.map((v,i)=>{
    const x=pad+(w-pad*2)*i/(trend.length-1);
    const y=h-pad-(h-pad*2)*(v-min)/rng; return [x,y];
  });
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=`${pad},${h-pad} `+line+` ${w-pad},${h-pad}`;
  const id='g'+Math.random().toString(36).slice(2,7);
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".28"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#${id})"/>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${col}"/>
  </svg>`;
}
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

/* ---------- 렌더 ---------- */
function render(){
  const rowsEl=document.getElementById('rows');
  const consField = PERIOD==='7d'?'cons7d':'cons24h';

  // 모드 필터
  let list = DATA.slice();
  if(MODE==='mine') list=list.filter(d=>favs.includes(d.term));

  // 정렬
  if(SORT==='cons') list.sort((a,b)=>b[consField]-a[consField]);
  else list.sort((a,b)=>a.term.localeCompare(b.term,'ko'));

  if(MODE==='mine' && list.length===0){
    rowsEl.innerHTML=`<div class="empty"><div class="big">🔖</div>
      저장한 키워드가 없습니다.<br>Top 100에서 ☆를 눌러 관심 키워드를 추가하세요.</div>`;
    return;
  }

  rowsEl.innerHTML=list.map((d,i)=>{
    const up=d.chg>=0;
    const sign=up?'▲':'▼';
    const chgCls=up?'up':'down';
    const star=favs.includes(d.term)?'on':'';
    const q=encodeURIComponent(d.term);
    return `<div class="row">
      <div><div class="rank">${i+1}</div></div>
      <div class="kw">
        <a class="name" style="text-decoration:none" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">${d.term}</a>
        <a class="ext" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">↗</a>
        <span class="star ${star}" onclick="toggleFav('${d.term.replace(/'/g,"\\'")}')">${favs.includes(d.term)?'★':'☆'}</span>
      </div>
      <div class="cons">${fmt(d[consField])}${PERIOD==='24h'?'<small>24시간 증가분</small>':''}</div>
      <div class="spark">
        ${sparkSVG(d.trend)}
        <span class="chg ${chgCls}">${sign}${Math.abs(d.chg).toFixed(1)}%</span>
        <div class="spk-lbl">
          <span>${d.startLabel}<b>${fmt(d.trend[0])}</b></span>
          <span style="text-align:right">${d.endLabel}<b>${fmt(d.trend[d.trend.length-1])}</b></span>
        </div>
      </div>
      <div class="status"><span class="ok">수집 완료</span><span class="upd">${d.upd} 업데이트</span></div>
    </div>`;
  }).join('');
}

/* ---------- 토글 ---------- */
function setMode(m){MODE=m;
  document.getElementById('mTop').classList.toggle('on',m==='top');
  document.getElementById('mMine').classList.toggle('on',m==='mine');
  document.getElementById('panelTitle').textContent = m==='top'?'주간 인기 키워드 TOP 100':'내 키워드';
  render();
}
function setPeriod(p){PERIOD=p;
  document.getElementById('p7').classList.toggle('on',p==='7d');
  document.getElementById('p24').classList.toggle('on',p==='24h');
  document.getElementById('basisBadge').textContent=(p==='7d'?'7일':'24시간')+' 조회수 기준';
  document.getElementById('consHead').textContent=(p==='7d'?'7일':'24시간')+' 소비량 ↓';
  render();
}
function toggleSort(){SORT=SORT==='cons'?'name':'cons';
  document.querySelector('#sortBtn span').textContent=SORT==='cons'?'소비량순':'가나다순';
  render();
}
function toggleFav(term){
  const i=favs.indexOf(term);
  if(i>=0)favs.splice(i,1); else favs.push(term);
  saveFavs(); render();
}

/* ---------- 데이터 로드: JSON 우선, 없으면 데모 ---------- */
fetch('data/keywords_7d.json',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw 0;return r.json()})
  .then(j=>{ DATA=buildData(j); document.getElementById('src').textContent='데이터: data/keywords_7d.json'; render(); })
  .catch(()=>{ DATA=buildData(DEMO); document.getElementById('src').textContent='※ 데모 데이터 표시 중 (data/keywords_7d.json 생성 시 자동 교체)'; render(); });
</script>
</body></html>
