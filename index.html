:root{--bg:#f6f7f9;--card:#fff;--fg:#1a1a1a;--sub:#666;--line:#e5e7eb;--accent:#c4302b;}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
header{padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:18px;margin:0 0 4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.nav{font-size:13px;font-weight:600;padding:6px 14px;border-radius:20px;background:var(--accent);color:#fff;text-decoration:none;white-space:nowrap}
.nav:hover{opacity:.9}
.meta{color:var(--sub);font-size:13px}
.quota{margin-top:8px;font-size:12px;color:var(--sub);max-width:440px}
.quota b{color:var(--fg)}
.qbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.qfill{height:100%;background:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.bar button,.bar select{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:20px;cursor:pointer}
.bar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar .lbl{font-size:12px;color:var(--sub);margin-left:4px}
.bar .sep{width:1px;height:20px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;padding:18px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.thumb{position:relative;aspect-ratio:16/9;background:#000;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;padding:1px 5px;border-radius:4px}
.tag{position:absolute;left:6px;top:6px;font-size:11px;padding:2px 7px;border-radius:4px;color:#fff}
.tag.v{background:#2563eb}.tag.s{background:#db2777}
.rank{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px}
.body{padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.title{font-size:14px;font-weight:600;line-height:1.35;color:var(--fg);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch{font-size:12px;color:var(--sub)}
.stats{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;color:var(--sub);margin-top:2px}
.stats b{color:var(--fg)}
.empty{padding:40px;text-align:center;color:var(--sub)}

      <span>일평균 <b>${fmt(d.일평균조회수)}</b></span>
      <span>❤ ${fmt(d.좋아요)}</span>
      <span>${esc(d.게시일)}</span>
    </div>
   </div>
  </div>`).join('') : '<div class="empty">조건에 맞는 영상이 없습니다.</div>';
}
function bindGroup(sel,set){document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{document.querySelectorAll(sel).forEach(x=>x.classList.remove('on'));b.classList.add('on');set(b);render()})}
bindGroup('.fbtn',b=>fil=b.dataset.f);
bindGroup('.rbtn',b=>reg=b.dataset.r);
bindGroup('.sbtn',b=>sub=b.dataset.sub);
kw.onchange=render;sort.onchange=render;render();
</script></body></html>
