 let rows=DATA.filter(d=>fil=='전체'||d.구분==fil).filter(d=>reg=='전체'||d.국가구분==reg).filter(matchSub).filter(d=>!kw.value||d.키워드==kw.value);
 const key=sort.value;
 rows.sort((a,b)=> key=='채널구독자수' ? ((a[key]==null?1e18:a[key])-(b[key]==null?1e18:b[key])) : ((b[key]||0)-(a[key]||0)));
 document.getElementById('cnt').textContent=rows.length;
 grid.innerHTML = rows.length? rows.map((d,i)=>`
  <div class="card">
   <a class="thumb" href="${d.영상URL}" target="_blank" rel="noopener">
     <span class="tag ${d.구분=='쇼츠'?'s':'v'}">${d.구분}</span>
     <span class="rank">#${i+1}</span>
     <img loading="lazy" src="https://i.ytimg.com/vi/${d.videoId}/mqdefault.jpg" alt="">
     <span class="dur">${dur(d.길이초)}</span>
   </a>
   <div class="body">
    <a class="title" href="${d.영상URL}" target="_blank" rel="noopener">${esc(d.제목)}</a>
    <div class="ch">${d.국가구분=='국내'?'🇰🇷':'🌐'} ${esc(d.채널명)} · 구독 ${fmt(d.채널구독자수)}</div>
    <div class="stats">
      <span>조회 <b>${fmt(d.조회수)}</b></span>
      <span>일평균 <b>${fmt(d.일평균조회수)}</b></span>
      <span>❤ ${fmt(d.좋아요)}</span>
      <span>${esc(d.게시일)}</span>
    </div>
   </div>
  </div>`).join('') : '<div class="empty">조건에 맞는 영상이 없습니다.</div>';
}
function bindGroup(sel,set){document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{document.querySelectorAll(sel).forEach(x=>x.classList.remove('on'));b.classList.add('on');set(b);render()})}
bindGroup('.fbtn',b=>fil=b.dataset.f);
bindGroup('.rbtn',b=>reg=b.dataset.r);
bindGroup('.sbtn',b=>sub=b.dataset.sub);
kw.onchange=render;sort.onchange=render;render();
</script></body></html>
